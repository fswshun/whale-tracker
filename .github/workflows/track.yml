name: whale-tracker
on:
  schedule:
    - cron: "*/10 * * * *"     # 10分ごと（GitHub の都合で数分遅れることあり。5分にすると無料枠を超える）
  workflow_dispatch:           # 手動実行ボタン
permissions:
  contents: write
concurrency:
  group: tracker
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: 取得・通知・HTML生成
        env:
          NODEREAL_KEY: ${{ secrets.NODEREAL_KEY }}
          BLOCKSCOUT_KEY: ${{ secrets.BLOCKSCOUT_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python tracker.py
      - name: 結果をコミット
        if: always()
        run: |
          git config user.name "whale-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data docs config.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "track $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push
